<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>재난관리국 신규조사반 통신망</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --navy-950:#0A1220; --navy-900:#0F1B30; --navy-800:#182848; --navy-600:#2E4368; --navy-line:#3A4F78;
    --paper:#F5F2E8; --paper-line:#E4DCC6; --paper-raised:#FBF9F2; --panel:#FFFFFF;
    --ink:#1C1A15; --ink-soft:#726B58; --ink-faint:#A69E88;
    --gold:#C8942F; --gold-dark:#9C7020; --gold-tint:#F2E4C4;
    --red:#A8362A; --red-dark:#7E271E; --red-tint:#F5E1DC;
    --green:#3E6B4A; --green-tint:#E4EDE3;
    --shadow: rgba(15,20,35,0.10); --shadow-lg: rgba(15,20,35,0.16);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'Pretendard', sans-serif; color:var(--ink); background:#DDD5C2;
    background-image: radial-gradient(circle at 1px 1px, rgba(28,26,21,0.06) 1px, transparent 0);
    background-size:22px 22px; overflow:hidden;
  }
  .shell{ height:100vh; height:100dvh; display:flex; flex-direction:column; max-width:1400px; margin:0 auto; background:var(--paper); box-shadow:0 0 60px var(--shadow-lg); }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-shrink:0;
    padding:12px 20px; background:var(--navy-950);
    background-image:linear-gradient(180deg, var(--navy-900), var(--navy-950));
    color:#fff; border-bottom:1px solid var(--navy-600);
  }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .seal{ width:38px; height:38px; flex-shrink:0; color:var(--gold); }
  .seal text{ font-family:'IBM Plex Mono', monospace; }
  .brand-text h1{ font-size:14.5px; font-weight:700; margin:0; letter-spacing:0.2px; }
  .tagline{ margin:2px 0 0; font-size:9.5px; color:var(--navy-line); font-family:'IBM Plex Mono', monospace; letter-spacing:0.8px; }

  .status-cluster{ text-align:right; flex-shrink:0; }
  .status-agent{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; color:#EDEDF0; }
  .status-line{ display:flex; align-items:center; justify-content:flex-end; gap:6px; font-family:'IBM Plex Mono', monospace; font-size:10px; color:#8FD9A0; font-weight:600; letter-spacing:0.4px; margin-top:2px; }
  .status-dot{ width:6px; height:6px; border-radius:50%; background:#4ADE80; box-shadow:0 0 0 0 rgba(74,222,128,0.6); animation:pulse 2s infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(74,222,128,0.55);} 70%{ box-shadow:0 0 0 6px rgba(74,222,128,0);} 100%{ box-shadow:0 0 0 0 rgba(74,222,128,0);} }
  @media (prefers-reduced-motion: reduce){ .status-dot{ animation:none; } }

  .notice-bar{
    background:var(--gold-tint); color:var(--red-dark); flex-shrink:0;
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:10px; padding:6px 20px; letter-spacing:0.2px;
    border-top:3px solid; border-bottom:1px solid #DCC98A;
    border-image:repeating-linear-gradient(-45deg, var(--gold) 0 7px, var(--navy-950) 7px 14px) 3;
  }

  /* ---------- Workspace: rail + list + detail ---------- */
  .workspace{ flex:1; min-height:0; display:flex; }

  .rail{
    width:68px; flex-shrink:0; background:var(--navy-950); border-right:1px solid var(--navy-600);
    display:flex; flex-direction:column; align-items:center; padding:14px 0; gap:6px;
  }
  .rail-btn{
    position:relative; width:42px; height:42px; border-radius:10px; border:none; background:none; color:#8493B8;
    display:flex; align-items:center; justify-content:center; cursor:pointer; background-size:cover; background-position:center;
  }
  .rail-btn svg{ width:20px; height:20px; }
  .rail-btn:hover{ background-color:var(--navy-800); color:#EDEDF0; }
  .rail-btn.active{ background-color:var(--navy-600); color:var(--gold); }
  .rail-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }
  .rail-spacer{ flex:1; }
  .rail-admin{ color:#6B7690; }
  .rail-admin.on{ background-color:var(--red); color:#fff; }
  .rail-avatar{ background-color:var(--navy-800); color:var(--gold); font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:12px; border-radius:50%; }
  .rail-avatar:hover{ background-color:var(--navy-600); }
  .back-btn{ display:none; background:none; border:none; color:var(--ink-soft); font-size:22px; line-height:1; cursor:pointer; padding:4px 8px 4px 0; }

  /* ---------- List panel ---------- */
  .list-panel{ width:320px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--paper-line); display:flex; flex-direction:column; min-height:0; }
  .list-header{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 16px 10px; flex-shrink:0; }
  .list-header h2{ display:flex; align-items:center; gap:5px; font-size:13px; font-weight:700; margin:0; color:var(--ink); font-family:'IBM Plex Mono', monospace; letter-spacing:0.2px; }
  .hdr-mark-icon{ display:inline-flex; color:var(--gold-dark); flex-shrink:0; }
  .hdr-mark-icon svg{ width:14px; height:14px; }
  .list-search{ padding:0 16px 10px; flex-shrink:0; }
  .list-search input{
    width:100%; border:1px solid var(--paper-line); background:var(--paper); border-radius:7px; padding:8px 11px;
    font-size:12.5px; font-family:'Pretendard', sans-serif; color:var(--ink);
  }
  .list-search input:focus-visible{ outline:2px solid var(--navy-950); }
  .list-body{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; min-height:0; padding:2px 8px 12px; }
  .list-stats{ padding:10px 12px 2px; font-size:10.5px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; text-align:center; }

  .list-row{
    display:flex; gap:10px; align-items:flex-start; padding:10px 8px; border-radius:9px; cursor:pointer;
    border:1px solid transparent; margin-bottom:2px;
  }
  .list-row:hover{ background:var(--paper); }
  .list-row.active{ background:var(--gold-tint); border-color:#E6CD8E; }
  .row-avatar{
    width:34px; height:34px; border-radius:50%; background:var(--navy-950); color:var(--gold); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; font-family:'IBM Plex Mono', monospace;
    background-size:cover; background-position:center;
  }
  .row-avatar.chat{ background-color:var(--gold-tint); color:var(--gold-dark); }
  .row-avatar.chat svg{ width:16px; height:16px; }
  .row-avatar.closed{ background-color:var(--ink-faint); color:#fff; }
  .row-main{ flex:1; min-width:0; }
  .row-top{ display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .row-title{ font-weight:700; font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-time{ font-size:9.5px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; flex-shrink:0; }
  .row-snippet{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-tags{ display:flex; gap:6px; margin-top:6px; align-items:center; }
  .tag{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:700; letter-spacing:0.2px;
    padding:2px 7px; border-radius:20px; background:var(--green-tint); color:var(--green);
  }
  .tag.closed{ background:var(--red-tint); color:var(--red); }
  .tag-case{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--ink-faint); }

  /* ---------- Detail panel ---------- */
  .detail-panel{ flex:1; min-width:0; display:flex; flex-direction:column; background:var(--paper); min-height:0; }
  .detail-header{ display:flex; align-items:center; gap:10px; padding:16px 22px; border-bottom:1px solid var(--paper-line); background:var(--paper-raised); flex-shrink:0; }
  .detail-header-main{ flex:1; min-width:0; }
  .detail-header h3{ margin:0; font-size:15px; font-weight:700; color:var(--ink); }
  .detail-case{ margin:0 0 2px; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--gold-dark); font-weight:700; letter-spacing:0.4px; }
  .detail-sub{ margin:3px 0 0; font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; }
  .detail-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:20px 22px; min-height:0; }
  .detail-desc{ font-size:13.5px; line-height:1.65; margin:0 0 14px; white-space:pre-wrap; word-break:break-word; max-width:640px; }
  .detail-actions{ display:flex; gap:8px; margin-bottom:16px; }
  .detail-divider{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:700; color:var(--ink-faint); letter-spacing:0.3px; margin:18px 0 8px; padding-top:14px; border-top:1px dashed var(--paper-line); }
  .detail-empty{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--ink-faint); }
  .detail-empty-mark{ font-size:34px; color:var(--paper-line); font-weight:700; }
  .detail-empty p{ font-size:13px; margin:0; }

  .btn{ font-family:'Pretendard', sans-serif; font-weight:700; border:none; cursor:pointer; border-radius:4px; padding:9px 15px; font-size:12.5px; }
  .btn:focus-visible{ outline:2px solid var(--navy-950); outline-offset:2px; }
  .btn-primary{ background:var(--navy-950); color:#fff; }
  .btn-primary:hover{ background:var(--navy-800); }
  .btn-ghost{ background:none; color:var(--ink-soft); }
  .btn-ghost:hover{ color:var(--ink); }
  .btn-small{ padding:6px 10px; font-size:11px; }
  .btn:disabled{ background:#E4E0D2 !important; color:var(--ink-faint) !important; cursor:default; }

  /* ---------- 채팅 말풍선 ---------- */
  #detailPanel > .chat-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:16px 22px; min-height:0; }
  .bubble-row{ display:flex; gap:8px; margin-bottom:14px; align-items:flex-end; }
  .bubble-row.mine{ flex-direction:row-reverse; }
  .bubble-col{ display:flex; flex-direction:column; max-width:70%; }
  .bubble-row.mine .bubble-col{ align-items:flex-end; }
  .bubble-name{ font-size:11px; font-weight:700; color:var(--ink-soft); margin:0 0 3px 3px; }
  .bubble{ background:#fff; border:1px solid var(--paper-line); border-radius:16px 16px 16px 4px; padding:9px 13px; font-size:13.5px; line-height:1.5; color:var(--ink); word-break:break-word; box-shadow:0 1px 2px var(--shadow); }
  .bubble-row.mine .bubble{ background:var(--navy-950); color:#fff; border-color:var(--navy-950); border-radius:16px 16px 4px 16px; }
  .bubble-time{ font-size:9px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; margin:3px 3px 0; }
  .msg-delete-btn{ background:none; border:none; color:var(--ink-faint); font-size:9px; font-family:'IBM Plex Mono', monospace; cursor:pointer; padding:0; margin-left:6px; text-decoration:underline; }
  .msg-delete-btn:hover{ color:var(--red); }

  /* ---------- 공고 댓글: 로그 행 + 답글 ---------- */
  .msg-row{ display:flex; gap:10px; padding:9px 4px; border-bottom:1px dashed var(--paper-line); }
  .msg-row:last-child{ border-bottom:none; }
  .msg-avatar{
    width:28px; height:28px; border-radius:50%; background:var(--navy-950); color:var(--gold);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; flex-shrink:0; font-family:'IBM Plex Mono', monospace;
    background-size:cover; background-position:center;
  }
  .msg-row.mine .msg-avatar{ background-color:var(--red); color:#fff; }
  .msg-body{ flex:1; min-width:0; }
  .msg-head{ display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .msg-name{ font-weight:700; font-size:12.5px; color:var(--ink); }
  .msg-time{ font-size:10px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; }
  .msg-text{ font-size:13px; color:var(--ink); margin-top:2px; line-height:1.55; word-break:break-word; max-width:640px; }
  .reply-to-tag{ font-size:10.5px; color:var(--gold-dark); font-weight:600; margin:1px 0 2px; }
  .reply-link{ background:none; border:none; color:var(--ink-faint); font-size:10.5px; font-family:'IBM Plex Mono', monospace; cursor:pointer; padding:4px 0 0; }
  .reply-link:hover{ color:var(--navy-950); text-decoration:underline; }
  .replying-banner{ display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--gold-tint); border:1px solid #E6CD8E; border-radius:6px; padding:6px 10px; margin:0 22px 8px; font-size:11.5px; color:var(--red-dark); }
  .replying-banner button{ background:none; border:none; color:var(--red-dark); font-size:14px; cursor:pointer; font-weight:700; line-height:1; }

  .chat-compose{ display:flex; gap:8px; padding:14px 22px; border-top:1px solid var(--paper-line); background:var(--paper-raised); flex-shrink:0; }
  .chat-compose input{ flex:1; min-width:0; border:1px solid var(--paper-line); background:#fff; border-radius:6px; padding:9px 12px; font-size:13px; font-family:'Pretendard', sans-serif; }
  .chat-compose input:focus-visible{ outline:2px solid var(--navy-950); }
  .empty{ text-align:center; padding:28px 12px; color:var(--ink-faint); font-size:12.5px; font-family:'IBM Plex Mono', monospace; }

  .stamp{
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:10px; letter-spacing:1px;
    border:2px solid var(--green); color:var(--green); border-radius:5px; padding:5px 9px;
    transform:rotate(-6deg); white-space:nowrap; flex-shrink:0; background:var(--green-tint); opacity:0.9;
  }
  .stamp.closed{ border-color:var(--red); color:var(--red); background:var(--red-tint); transform:rotate(-4deg); }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(10,18,32,0.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .overlay[hidden]{ display:none; }
  .modal{ background:var(--paper); border-radius:5px; border:1px solid #C9BFA0; width:100%; max-width:440px; max-height:88vh; overflow-y:auto; padding:22px 20px 20px; box-shadow:0 20px 50px rgba(10,18,32,0.35); }
  .modal h3{ font-size:15px; font-weight:700; margin:0 0 4px; color:var(--navy-950); }
  .modal p.hint{ margin:0 0 14px; font-size:12px; color:var(--ink-soft); line-height:1.5; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; font-weight:700; font-family:'IBM Plex Mono', monospace; letter-spacing:0.2px; }
  .field input, .field textarea{ width:100%; font-family:'Pretendard', sans-serif; background:var(--paper-raised); border:1px solid var(--paper-line); border-radius:4px; padding:9px 11px; font-size:13.5px; color:var(--ink); }
  .field textarea{ resize:vertical; min-height:60px; }
  .field input:focus-visible, .field textarea:focus-visible{ outline:2px solid var(--navy-950); outline-offset:1px; }
  .error-msg{ color:var(--red); font-size:12px; margin:-4px 0 10px; min-height:14px; font-weight:600; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }

  .photo-picker{ display:flex; align-items:center; gap:12px; }
  .photo-preview{
    width:56px; height:56px; border-radius:50%; background:var(--navy-950); color:var(--gold);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; font-family:'IBM Plex Mono', monospace;
    flex-shrink:0; border:2px solid var(--paper-line); background-size:cover; background-position:center;
  }
  .photo-picker-actions{ display:flex; gap:6px; flex-wrap:wrap; }

  /* ---------- Mobile ---------- */
  @media (max-width:860px){
    .shell{ max-width:100%; box-shadow:none; }
    .workspace{ flex-direction:column; position:relative; }
    .rail{ order:3; width:100%; min-height:56px; height:auto; flex-direction:row; padding:6px 10px calc(6px + env(safe-area-inset-bottom)); border-right:none; border-top:1px solid var(--navy-600); gap:2px; }
    .rail-spacer{ display:none; }
    .list-panel{ order:1; width:100%; }
    .detail-panel{ order:2; width:100%; }
    .list-panel, .detail-panel{ display:none; flex:1; }
    .workspace:not(.detail-active) .list-panel{ display:flex; }
    .workspace.detail-active .detail-panel{ display:flex; }
    .back-btn{ display:inline-flex; align-items:center; }
    .status-agent{ display:none; }
    .topbar{ padding:11px 14px; }
    .detail-scroll, #detailPanel > .chat-scroll{ padding-left:14px; padding-right:14px; }
    .chat-compose, .detail-header{ padding-left:14px; padding-right:14px; }
    .replying-banner{ margin-left:14px; margin-right:14px; }
  }
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
        <defs><path id="sealRing" d="M 50,50 m -37,0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0" /></defs>
        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="50" cy="50" r="37" fill="none" stroke="currentColor" stroke-width="1"/>
        <text font-size="8.6" fill="currentColor" letter-spacing="2">
          <textPath href="#sealRing" startOffset="4%">재난관리국 · 신규조사반 · </textPath>
        </text>
        <text x="50" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">災</text>
      </svg>
      <div class="brand-text">
        <h1>재난관리국 신규조사반</h1>
        <p class="tagline">INTERNAL COMMS · SECURE CHANNEL</p>
      </div>
    </div>
    <div class="status-cluster">
      <div class="status-agent" id="statusAgent">AGENT: 미확인</div>
      <div class="status-line"><span class="status-dot"></span>ONLINE · <span id="statusClock">--:--:--</span></div>
    </div>
  </header>
  <div class="notice-bar">※ 본 통신망은 재난관리국 소속 요원 전용입니다. 외부 유출을 금지합니다.</div>

  <div class="workspace" id="workspace">
    <nav class="rail">
      <button class="rail-btn active" data-mode="chat" title="채널" id="railChatBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4H12a8.3 8.3 0 0 1-3.8-.9L3 21l1.9-5.7A8.3 8.3 0 0 1 4 11.5 8.4 8.4 0 0 1 12.4 3H12a8.4 8.4 0 0 1 8.4 8.4z"/></svg>
      </button>
      <button class="rail-btn" data-mode="recruit" title="재난 대응 인원 모집" id="railRecruitBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a1 1 0 0 0 1 1h3l5 4V5L7 9H4a1 1 0 0 0-1 1z"/><path d="M16 8.5a4 4 0 0 1 0 7"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-btn rail-admin" id="adminToggleBtn" title="관리자">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </button>
      <button class="rail-btn rail-avatar" id="profileBtn" title="내 프로필"><span id="railAvatarText">?</span></button>
    </nav>

    <aside class="list-panel" id="listPanel"></aside>

    <main class="detail-panel" id="detailPanel"></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modalBody"></div>
</div>

<script type="module">
/* =========================================================
   재난관리국 내부망 — 고구마켓과 같은 Firebase 프로젝트를 재사용해.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyADlix7kNMQdrHCBA6Licd5tQyr1BjbRBE",
  authDomain: "gogumarket-cda44.firebaseapp.com",
  projectId: "gogumarket-cda44",
  storageBucket: "gogumarket-cda44.firebasestorage.app",
  messagingSenderId: "144928327825",
  appId: "1:144928327825:web:6f4a456110d2de656d1730"
};
const ADMIN_PASSWORD = "goguma1234";

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, setDoc,
  getDoc, getDocs, onSnapshot, query, orderBy, limit
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

function getAgentId(){
  let id = localStorage.getItem('db_agent_id');
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : 'agent-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    localStorage.setItem('db_agent_id', id);
  }

}
function getLocalProfile(){

function formatTime(iso){ return new Date(iso).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; }
function showToastError(msg){ alert(msg || '문제가 생겼어요. 인터넷 연결을 확인하고 다시 시도해주세요.'); }
function initials(name){ return (name || '?').trim().slice(0,2); }
function pad4(n){ return String(n).padStart(4,'0'); }

function avatarStyle(authorId){
  const p = agentProfiles[authorId];
  if(p && p.photoURL) return `background-image:url('${p.photoURL}');`;
  return '';
}
function avatarInner(authorId, authorName){
  const p = agentProfiles[authorId];
  return (p && p.photoURL) ? '' : escapeHtml(initials(authorName));
}
function resizeImageToDataURL(file, size){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read-failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode-failed'));
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minSide = Math.min(img.width, img.height);
        const sx = (img.width - minSide) / 2, sy = (img.height - minSide) / 2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function updateAgentBar(){
  const label = (myProfile && myProfile.name) ? (myProfile.name + ' 요원' + (myProfile.bio ? ' · ' + myProfile.bio : '')) : '미확인';
  el('statusAgent').textContent = 'AGENT: ' + label;

    el('railAvatarText').textContent = '';
  }else{
    btn.style.backgroundImage = '';
    el('railAvatarText').textContent = (myProfile && myProfile.name) ? initials(myProfile.name) : '?';
  }
}

function tickClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  el('statusClock').textContent = `${hh}:${mm}:${ss}`;
}
tickClock();
setInterval(tickClock, 1000);

el('profileBtn').addEventListener('click', openProfileModal);
function openProfileModal(){
  pendingPhotoURL = (myProfile && myProfile.photoURL) || null;
  const previewStyle = pendingPhotoURL ? `background-image:url('${pendingPhotoURL}');` : '';
  const previewText = pendingPhotoURL ? '' : ((myProfile && myProfile.name) ? initials(myProfile.name) : '?');
  openModal(`

        </div>
      </div>
    </div>
    <div class="field"><label for="profNameInput">요원 이름</label><input type="text" id="profNameInput" maxlength="20" value="${myProfile ? escapeHtml(myProfile.name) : ''}"></div>
    <div class="field"><label for="profBioInput">소속 / 비고 (선택)</label><input type="text" id="profBioInput" maxlength="40" placeholder="예: 3팀, 야간 근무" value="${myProfile && myProfile.bio ? escapeHtml(myProfile.bio) : ''}"></div>
    <p class="error-msg" id="profError"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="profCancel">취소</button>
      <button class="btn btn-primary" id="profSave">등록</button>
    </div>
  `);
  el('profNameInput').focus();
  el('photoPickBtn').addEventListener('click', () => el('photoInput').click());
  el('photoInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      pendingPhotoURL = await resizeImageToDataURL(file, 160);
      const prev = el('photoPreview');
      prev.style.backgroundImage = `url('${pendingPhotoURL}')`;
      prev.textContent = '';
      el('photoRemoveBtn').style.display = '';
    }catch(err){ el('profError').textContent = '이미지를 불러오지 못했습니다. 다른 파일을 선택해주세요.'; }
  });
  el('photoRemoveBtn').addEventListener('click', () => {
    pendingPhotoURL = null;
    const prev = el('photoPreview');
    prev.style.backgroundImage = '';
    const nm = el('profNameInput').value.trim();
    prev.textContent = nm ? initials(nm) : '?';
    el('photoRemoveBtn').style.display = 'none';
  });
  el('profSave').addEventListener('click', async () => {
    const name = el('profNameInput').value.trim();
    const bio = el('profBioInput').value.trim();
    if(!name){ el('profError').textContent = '이름을 적어주세요.'; return; }
    myProfile = { name, bio, photoURL: pendingPhotoURL || null };
    setLocalProfile(myProfile);
    agentProfiles[myAgentId] = { name, bio, photoURL: pendingPhotoURL || null };
    updateAgentBar();
    closeModal();
    renderListPanel();
    renderDetailPanel();
    try{ await setDoc(doc(agentsCol, myAgentId), { name, bio, photoURL: pendingPhotoURL || null, updatedAt: new Date().toISOString() }, { merge: true }); }catch(e){}
  });
  el('profCancel').addEventListener('click', closeModal);
}
function requireProfile(){

function messagesForChannel(channelId){ return allMessages.filter(m => (m.channelId || 'notice') === channelId); }

    <div class="list-body" id="channelListBody"></div>
  `;
  renderChannelRows();
}
function renderChannelRows(){
  const body = el('channelListBody');
  if(!body) return;
  body.innerHTML = CHANNELS.map(c => {
    const msgs = messagesForChannel(c.id);
    const last = msgs[msgs.length - 1];
    return `
    <div class="list-row ${c.id === selectedChannelId ? 'active' : ''}" data-channel="${c.id}">
      <div class="row-avatar chat">${CHAT_ICON}</div>
      <div class="row-main">
        <div class="row-top"><span class="row-title">${escapeHtml(c.name)}</span><span class="row-time">${last ? formatTime(last.sentAt) : ''}</span></div>

      </div>

  body.querySelectorAll('[data-channel]').forEach(row => row.addEventListener('click', () => selectChannel(row.dataset.channel)));
}
function selectChannel(id){
  selectedChannelId = id;
  renderChannelRows();
  renderChatDetail();
  showMobileDetail();
}
function bubbleHtml(m){
  const mine = m.authorId === myAgentId;
  return `
    <div class="bubble-row ${mine ? 'mine' : ''}">
      ${!mine ? `<div class="msg-avatar" style="${avatarStyle(m.authorId)}">${avatarInner(m.authorId, m.authorName)}</div>` : ''}
      <div class="bubble-col">
        ${!mine ? `<div class="bubble-name">${escapeHtml(m.authorName)}</div>` : ''}
        <div class="bubble">${escapeHtml(m.text)}</div>
        <div class="bubble-time">${formatTime(m.sentAt)}${isAdmin ? `<button type="button" class="msg-delete-btn" data-del-msg="${m.id}">삭제</button>` : ''}</div>
      </div>
    </div>`;
}
function renderChatBubbles(messages){
  const wrap = document.getElementById('chatScroll');
  if(!wrap) return;
  if(messages.length === 0){
    wrap.innerHTML = `<div class="empty">등록된 메시지가 없습니다.</div>`;
    return;
  }
  wrap.innerHTML = messages.map(bubbleHtml).join('');
  wrap.scrollTop = wrap.scrollHeight;
  wrap.querySelectorAll('[data-del-msg]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try{ await deleteDoc(doc(messagesCol, btn.dataset.delMsg)); }
      catch(err){ showToastError(); }
    });
  });
}
function renderChatDetail(){
  const ch = CHANNELS.find(c => c.id === selectedChannelId) || CHANNELS[0];
  el('detailPanel').innerHTML = `
    <div class="detail-header">
      <button class="back-btn" id="backBtn" aria-label="목록으로">‹</button>
      <div class="detail-header-main">
        <h3>${escapeHtml(ch.name)}</h3>
        ${ch.subtitle ? `<p class="detail-sub">${escapeHtml(ch.subtitle)}</p>` : ''}
      </div>
    </div>
    <div class="chat-scroll" id="chatScroll"><div class="empty">불러오는 중…</div></div>
    <div class="chat-compose">
      <input type="text" id="chatInput" maxlength="500" placeholder="메시지 입력">
      <button class="btn btn-primary" id="chatSendBtn">전송</button>
    </div>
  `;
  el('backBtn').addEventListener('click', showMobileList);
  el('chatSendBtn').addEventListener('click', sendChannelMessage);
  el('chatInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') sendChannelMessage(); });
  renderChatBubbles(messagesForChannel(selectedChannelId));
}
async function sendChannelMessage(){
  if(!requireProfile()) return;
  const input = el('chatInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  try{ await addDoc(messagesCol, { channelId: selectedChannelId, authorId: myAgentId, authorName: myProfile.name, text, sentAt: new Date().toISOString() }); }
  catch(e){ showToastError(); }
}

  body.innerHTML = filtered.map(r => `

      <div class="row-avatar ${r.status === 'closed' ? 'closed' : ''}" style="${avatarStyle(r.authorId)}">${avatarInner(r.authorId, r.authorName)}</div>
      <div class="row-main">
        <div class="row-top"><span class="row-title">${escapeHtml(r.title)}</span><span class="row-time">${formatTime(r.createdAt)}</span></div>
        <div class="row-snippet">${escapeHtml(r.description)}</div>
        <div class="row-tags">
          <span class="tag ${r.status === 'closed' ? 'closed' : ''}">${r.status === 'closed' ? '모집완료' : (r.neededCount ? '모집 ' + r.neededCount + '명' : '모집중')}</span>

        </div>
      </div>

    row.addEventListener('click', () => selectRecruit(row.dataset.id));
  });

function openRecruitFormModal(){
  openModal(`
    <h3>공고 등록</h3>
    <p class="hint">함께 대응할 인원을 모집합니다.</p>
    <div class="field"><label for="rTitleInput">제목</label><input type="text" id="rTitleInput" maxlength="60" placeholder="예: 심야 버스 노선 공동 조사 인원 모집"></div>
    <div class="field"><label for="rCountInput">필요 인원 (선택)</label><input type="number" id="rCountInput" min="1" step="1"></div>
    <div class="field"><label for="rDescInput">상세 내용</label><textarea id="rDescInput" maxlength="500"></textarea></div>
    <p class="error-msg" id="rError"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="rCancel">취소</button>
      <button class="btn btn-primary" id="rSubmit">등록</button>

  el('rTitleInput').focus();
  el('rSubmit').addEventListener('click', async () => {

    if(!title || !description){ el('rError').textContent = '제목과 상세 내용을 모두 입력해주세요.'; return; }
    try{
      await addDoc(recruitsCol, {
        title, description, neededCount: neededCount ? Number(neededCount) : null,
        authorId: myAgentId, authorName: myProfile.name, status: 'open',
        createdAt: new Date().toISOString()
      });
      closeModal();
    }catch(e){ el('rError').textContent = '등록 중 문제가 생겼습니다. 다시 시도해주세요.'; }
  });
  el('rCancel').addEventListener('click', closeModal);
}
function selectRecruit(id){
  selectedRecruitId = id;
  currentReplies = [];
  replyingTo = null;
  if(unsubscribeReplies){ unsubscribeReplies(); unsubscribeReplies = null; }
  renderRecruitRows();
  renderDetailPanel();
  unsubscribeReplies = onSnapshot(
    query(collection(db, 'recruits', id, 'replies'), orderBy('sentAt', 'asc'), limit(200)),
    (snap) => { currentReplies = snap.docs.map(d => ({ id: d.id, ...d.data() })); if(selectedRecruitId === id) renderDetailPanel(); },
    (err) => console.error(err)
  );
  showMobileDetail();
}

        <p class="msg-text">${escapeHtml(rep.text)}</p>
        <button type="button" class="reply-link" data-reply-id="${rep.id}" data-reply-name="${escapeHtml(rep.authorName)}">답글</button>${isAdmin ? `<button type="button" class="reply-link" data-del-reply="${rep.id}">삭제</button>` : ''}

  const canManage = isAdmin || r.authorId === myAgentId;

  const toggleBtn = document.getElementById('rToggleBtn');
  if(toggleBtn) toggleBtn.addEventListener('click', async () => {
    const newStatus = r.status === 'closed' ? 'open' : 'closed';
    try{ await updateDoc(doc(recruitsCol, r.id), { status: newStatus }); }
    catch(e){ showToastError(); }
  });
  const deleteBtn = document.getElementById('rDeleteBtn');
  if(deleteBtn) deleteBtn.addEventListener('click', async () => {
    try{
      await deleteDoc(doc(recruitsCol, r.id));
      selectedRecruitId = null;
      if(unsubscribeReplies){ unsubscribeReplies(); unsubscribeReplies = null; }
      renderDetailPanel();
      showMobileList();
    }catch(e){ showToastError(); }
  });
  panel.querySelectorAll('[data-reply-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      if(!requireProfile()) return;
      replyingTo = { id: btn.dataset.replyId, name: btn.dataset.replyName };
      renderDetailPanel();
      const input = el('replyInput'); if(input) input.focus();
    });
  });
  panel.querySelectorAll('[data-del-reply]').forEach(btn => {
    btn.addEventListener('click', async () => {
      try{ await deleteDoc(doc(db, 'recruits', r.id, 'replies', btn.dataset.delReply)); }
      catch(e){ showToastError(); }
    });
  });
  const cancelReplyBtn = document.getElementById('cancelReplyBtn');
  if(cancelReplyBtn) cancelReplyBtn.addEventListener('click', () => { replyingTo = null; renderDetailPanel(); });
  const send = async () => {
    if(!requireProfile()) return;
    const input = el('replyInput');
    const text = input.value.trim();
    if(!text) return;
    const payload = { authorId: myAgentId, authorName: myProfile.name, text, sentAt: new Date().toISOString() };
    if(replyingTo){ payload.replyToId = replyingTo.id; payload.replyToName = replyingTo.name; }
    input.value = '';
    replyingTo = null;
    renderDetailPanel();
    try{ await addDoc(collection(db, 'recruits', r.id, 'replies'), payload); }
    catch(e){ showToastError(); }
  };
  el('replySendBtn').addEventListener('click', send);
  el('replyInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') send(); });
}

function boot(){
  updateAgentBar();
  setMode('chat');
  if(!isConfigured){
    const body = el('listPanel').querySelector('.list-body');
    if(body) body.innerHTML = `<div class="empty">⚙️ Firebase 설정이 안 됐어요.</div>`;
    return;
  }
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  messagesCol = collection(db, 'messages');
  recruitsCol = collection(db, 'recruits');
  agentsCol = collection(db, 'agents');

  onSnapshot(agentsCol, (snap) => {
    const map = {};
    snap.docs.forEach(d => { map[d.id] = d.data(); });
    agentProfiles = map;
    renderListPanel();
    renderDetailPanel();
  }, (err) => console.error(err));

  onSnapshot(query(messagesCol, orderBy('sentAt', 'desc'), limit(400)), (snap) => {
    allMessages = snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse();
    if(currentMode === 'chat'){ renderChannelRows(); renderChatBubbles(messagesForChannel(selectedChannelId)); }
  }, (err) => { console.error(err); const wrap = document.getElementById('chatScroll'); if(wrap) wrap.innerHTML = `<div class="empty">⚠️ 채널을 불러오지 못했습니다.</div>`; });

  onSnapshot(query(recruitsCol, orderBy('createdAt', 'desc'), limit(100)), (snap) => {
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    docs.forEach((r, i) => { const seq = docs.length - i; r.caseNo = `CASE-${new Date(r.createdAt).getFullYear()}-${pad4(seq)}`; });
    lastRecruits = docs;
    if(currentMode === 'recruit') renderRecruitRows();
    if(selectedRecruitId) renderDetailPanel();
  }, (err) => { console.error(err); const body = document.getElementById('recruitListBody'); if(body) body.innerHTML = `<div class="empty">⚠️ 공고를 불러오지 못했습니다.</div>`; });
}
boot();
</script>
